<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { 
    background: #0a0a0a; 
    color: white; 
    font-family: 'Segoe UI', Tahoma, sans-serif; 
    margin: 0;
    overflow-x: hidden;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #1a1a1a; }
  ::-webkit-scrollbar-thumb { background: #e50914; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #ff0a16; }
  
  .movie-card { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  .movie-card:hover { transform: scale(1.08); z-index: 10; }
  
  .fade-in { animation: fadeIn 0.5s ease-out; }
  @keyframes fadeIn { 
    from { opacity: 0; transform: translateY(20px); } 
    to { opacity: 1; transform: translateY(0); } 
  }
  
  .server-btn { transition: all 0.25s; position: relative; overflow: hidden; }
  .server-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transition: left 0.5s;
  }
  .server-btn:hover::before { left: 100%; }
  .server-btn:hover { 
    transform: translateY(-3px); 
    box-shadow: 0 10px 25px rgba(229,9,20,0.4); 
  }
  
  .spinner { 
    border: 3px solid #333; 
    border-top: 3px solid #e50914; 
    border-radius: 50%; 
    width: 24px; height: 24px; 
    animation: spin 0.8s linear infinite; 
    display: inline-block; 
  }
  @keyframes spin { 
    0% { transform: rotate(0deg); } 
    100% { transform: rotate(360deg); } 
  }
  
  input, textarea, select { color-scheme: dark; }
  
  .cast-card { transition: transform 0.2s; }
  .cast-card:hover { transform: translateY(-5px); }
  
  .dropdown-group { position: relative; }
  .dropdown-group:hover .dropdown-panel { display: block; }
  
  .gradient-text {
    background: linear-gradient(135deg, #e50914, #ff6b35);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  .glass {
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  
  .hero-gradient {
    background: linear-gradient(to top, #0a0a0a 0%, rgba(10,10,10,0.8) 30%, transparent 100%);
  }
  
  @media (max-width: 640px) {
    .movie-card:hover { transform: scale(1.03); }
  }
  
  .quality-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(229, 9, 20, 0.9);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: bold;
  }
  
  .ramadan-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    background: linear-gradient(135deg, #f59e0b, #d97706);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: bold;
    color: #fff;
  }
</style>

const load = (k, d) => {

const TMDB = {
  async fetch(url) {
    const res = await fetch(url);
    if (!res.ok) {
      const e = new Error(`HTTP ${res.status}`);
      e.status = res.status;
      throw e;
    }
    return res.json();
  },
  async searchMovie(query) {
    return this.fetch(`${CONFIG.TMDB_BASE}/search/movie?api_key=${CONFIG.TMDB_API_KEY}&language=ar&query=${encodeURIComponent(query)}&include_adult=false`);
  },
  async searchMulti(query) {
    return this.fetch(`${CONFIG.TMDB_BASE}/search/multi?api_key=${CONFIG.TMDB_API_KEY}&language=ar&query=${encodeURIComponent(query)}&include_adult=false`);
  },
  async getMovieDetails(id) {
    return this.fetch(`${CONFIG.TMDB_BASE}/movie/${id}?api_key=${CONFIG.TMDB_API_KEY}&language=ar&append_to_response=videos,credits,images`);
  },
  async getSeriesByCategory(apiFilter, page = 1) {
    return this.fetch(`${CONFIG.TMDB_BASE}/discover/tv?api_key=${CONFIG.TMDB_API_KEY}&language=ar&page=${page}&sort_by=popularity.desc&${apiFilter}`);
  },
  async getSeriesDetails(id) {
    return this.fetch(`${CONFIG.TMDB_BASE}/tv/${id}?api_key=${CONFIG.TMDB_API_KEY}&language=ar&append_to_response=videos,credits`);
  },
  async getSeasonDetails(id, seasonNumber) {
    return this.fetch(`${CONFIG.TMDB_BASE}/tv/${id}/season/${seasonNumber}?api_key=${CONFIG.TMDB_API_KEY}&language=ar`);
  },
  async getMovies({ sortBy = "popularity.desc", genre = null, page = 1 } = {}) {
    let url = `${CONFIG.TMDB_BASE}/discover/movie?api_key=${CONFIG.TMDB_API_KEY}&language=ar&page=${page}&sort_by=${sortBy}&include_adult=false`;
    if (genre) url += `&with_genres=${genre}`;
    return this.fetch(url);
  },
  img(path, size = "w500") { return path ? `${CONFIG.TMDB_IMG}/${size}${path}` : null; }
};

function fallbackPoster(title, cat = "فيلم") {
  const safeTitle = (title && typeof title === "string" && title.trim()) ? title : "بدون عنوان";
  const safeCat = (cat && typeof cat === "string") ? cat : "فيلم";
  
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450">
    <defs>
      <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#e50914"/>
        <stop offset="100%" stop-color="#1a1a1a"/>
      </linearGradient>
    </defs>
    <rect width="300" height="450" fill="url(#g)"/>
    <circle cx="150" cy="180" r="50" fill="rgba(255,255,255,0.15)"/>
    <text x="150" y="200" text-anchor="middle" font-size="55" fill="rgba(255,255,255,0.5)">🎬</text>
    <text x="150" y="290" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#fff" direction="rtl">${safeTitle.substring(0, 18)}</text>
    <text x="150" y="320" text-anchor="middle" font-family="Arial" font-size="12" fill="rgba(255,255,255,0.6)" direction="rtl">${safeCat}</text>
  </svg>`;
  return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
}

          <a href="#home" onClick={(e) => { e.preventDefault(); onNavigate("home"); }} className={`${navLink} ${currentPage === "home" ? "text-red-500 font-bold" : ""}`}>الرئيسية</a>

          <div className="dropdown-group">
            <button className={`${navLink} py-2`}>أفلام ▾</button>
            <div className="dropdown-panel absolute top-full right-0 mt-1 glass border border-gray-700 rounded-lg shadow-2xl p-2 hidden min-w-[180px] z-50">
              <a href="#movies" onClick={(e) => { e.preventDefault(); onNavigate("movies"); }} className="block px-4 py-2 hover:bg-red-600/30 rounded text-right">كل الأفلام</a>
              <a href="#movies" onClick={(e) => { e.preventDefault(); onNavigate("movies"); }} className="block px-4 py-2 hover:bg-red-600/30 rounded text-right">الأكثر شهرة</a>
              <a href="#movies" onClick={(e) => { e.preventDefault(); onNavigate("movies"); }} className="block px-4 py-2 hover:bg-red-600/30 rounded text-right">الأعلى تقييماً</a>
              <a href="#movies" onClick={(e) => { e.preventDefault(); onNavigate("movies"); }} className="block px-4 py-2 hover:bg-red-600/30 rounded text-right">أكشن</a>
              <a href="#movies" onClick={(e) => { e.preventDefault(); onNavigate("movies"); }} className="block px-4 py-2 hover:bg-red-600/30 rounded text-right">دراما</a>
              <a href="#movies" onClick={(e) => { e.preventDefault(); onNavigate("movies"); }} className="block px-4 py-2 hover:bg-red-600/30 rounded text-right">رعب</a>
            </div>

          <div className="dropdown-group">
            <button className={`${navLink} py-2`}>مسلسلات ▾</button>

              {SERIES_CATEGORIES.map(c => (

              ))}

          <a href="#admin" onClick={(e) => { e.preventDefault(); onNavigate("admin"); }} className="text-yellow-500 hover:text-yellow-400 font-bold">⚙️ الإدارة</a>

          </div>

}

function Hero({ movie, onPlay }) {
  if (!movie) return null;
  return (
    <div className="relative h-[85vh] min-h-[500px] w-full fade-in">
      <div className="absolute inset-0 bg-cover bg-center" style={{ backgroundImage: `url(${movie.backdrop || movie.poster})` }} />
      <div className="absolute inset-0 hero-gradient" />
      <div className="relative h-full container mx-auto px-4 flex flex-col justify-end pb-24 max-w-7xl">
        <div className="max-w-2xl">
          <div className="flex items-center gap-3 mb-3 flex-wrap">
            <span className="bg-red-600 px-3 py-1 rounded-full text-xs font-bold animate-pulse">🔥 جديد</span>

const MovieCard = memo(({ movie, onClick }) => {
  const [imgSrc, setImgSrc] = useState(movie.poster || fallbackPoster(movie.title_ar, movie.isSeries ? "مسلسل" : "فيلم"));
  
  useEffect(() => {
    setImgSrc(movie.poster || fallbackPoster(movie.title_ar, movie.isSeries ? "مسلسل" : "فيلم"));
  }, [movie.poster, movie.title_ar, movie.isSeries]);

  const isRamadan = movie.isRamadan;

  return (
    <div onClick={() => onClick(movie)} className="movie-card cursor-pointer flex-shrink-0 w-36 md:w-44 lg:w-48 relative group">
      <div className="relative overflow-hidden rounded-lg shadow-lg">
        <img 
          src={imgSrc} 
          alt={movie.title_ar} 
          className="w-full h-56 md:h-64 lg:h-72 object-cover bg-gray-800" 
          loading="lazy" 
          onError={() => setImgSrc(fallbackPoster(movie.title_ar, movie.isSeries ? "مسلسل" : "فيلم"))} 
        />
        <span className="quality-badge">HD</span>
        {isRamadan && <span className="ramadan-badge">🌙 رمضان</span>}
        {movie.isSeries && !isRamadan && <span className="absolute top-2 right-2 bg-blue-600 text-xs px-2 py-0.5 rounded font-bold">مسلسل</span>}
        
        <div className="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity rounded-lg flex flex-col justify-end p-3">
          <h3 className="font-bold text-sm mb-1 line-clamp-2">{movie.title_ar}</h3>
          <div className="flex items-center gap-2 text-xs text-gray-300">
            <span className="text-yellow-400">⭐ {movie.rating}</span>
            <span>{movie.year}</span>
          </div>
          <button className="mt-3 bg-red-600 hover:bg-red-700 py-2 rounded font-bold text-xs transition">▶ مشاهدة</button>
        </div>
      </div>
    </div>
  );
});

function MovieRow({ title, movies, onMovieClick }) {
  const ref = useRef(null);
  if (!movies || movies.length === 0) return null;
  
  return (
    <div className="mb-10 fade-in">
      <div className="flex items-center justify-between mb-4 px-4">
        <h2 className="text-xl md:text-2xl font-bold">{title}</h2>
        <div className="flex gap-2">
          <button onClick={() => ref.current?.scrollBy({ left: -400, behavior: 'smooth' })} className="bg-gray-800 hover:bg-gray-700 w-9 h-9 rounded-full transition">‹</button>
          <button onClick={() => ref.current?.scrollBy({ left: 400, behavior: 'smooth' })} className="bg-gray-800 hover:bg-gray-700 w-9 h-9 rounded-full transition">›</button>
        </div>
      </div>
      <div ref={ref} className="flex gap-3 overflow-x-auto px-4 pb-4" style={{ scrollbarWidth: 'thin' }}>
        {movies.map((m, i) => <MovieCard key={`${m.id}-${i}`} movie={m} onClick={onMovieClick} />)}
      </div>
    </div>
  );
}

function SmartPlayer({ tmdbId, type = "movie", season, episode, title, videoServers, seriesServers }) {
  const [activeServer, setActiveServer] = useState(0);
  const [loading, setLoading] = useState(true);
  const [iframeKey, setIframeKey] = useState(0);

  const baseServers = type === "movie" ? (videoServers || DEFAULT_VIDEO_SERVERS) : (seriesServers || DEFAULT_SERIES_SERVERS);

  const servers = baseServers
    .filter(s => s.enabled !== false)
    .map(s => ({
      name: s.name,
      quality: s.quality || "1080p",
      url: type === "movie"
        ? s.tmpl.replace("{id}", tmdbId)
        : s.tmpl.replace("{id}", tmdbId).replace("{s}", season).replace("{e}", episode)
    }));

  useEffect(() => { 
    setLoading(true); 
    setIframeKey(k => k + 1);
  }, [activeServer, tmdbId, season, episode]);

  const handleReload = () => {
    setLoading(true);
    setIframeKey(k => k + 1);
  };

  return (
    <div>
      <div className="flex gap-2 mb-4 flex-wrap items-center">
        <h3 className="text-lg font-bold">🎬 سيرفرات المشاهدة</h3>
        <button
          onClick={handleReload}
          className="px-4 py-2 rounded-lg font-bold bg-gray-800 hover:bg-gray-700 transition-all ms-auto text-sm"
          title="إعادة تحميل السيرفر"
        >
          🔄 إعادة تحميل
        </button>
      </div>

      <div className="aspect-video bg-black rounded-lg overflow-hidden mb-4 shadow-2xl relative border border-gray-800">
        {tmdbId && servers.length > 0 ? (
          <iframe
            key={iframeKey}
            src={servers[activeServer].url}
            className="w-full h-full"
            allowFullScreen
            allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
            title={title}
            onLoad={() => setLoading(false)}
            referrerPolicy="no-referrer"
          />
        ) : (
          <div className="w-full h-full flex items-center justify-center text-gray-500">
            <div className="text-center">
              <div className="text-6xl mb-4">🎬</div>
              <p>لا يوجد سيرفر متاح</p>
            </div>
          </div>
        )}
        {loading && tmdbId && servers.length > 0 && (
          <div className="absolute inset-0 bg-black/80 flex items-center justify-center pointer-events-none">
            <div className="text-center">
              <div className="spinner mx-auto mb-3" style={{ width: 45, height: 45, borderWidth: 4 }}></div>
              <p className="text-sm text-gray-300">⏳ جاري التحميل... <span className="text-red-400 font-bold">{servers[activeServer]?.name}</span></p>
              <p className="text-xs text-gray-500 mt-2">إذا تأخر التحميل، جرّب سيرفر آخر</p>
            </div>
          </div>
        )}
      </div>
      
      <h3 className="text-lg font-bold mb-3">🎬 اختر سيرفر المشاهدة: <span className="text-sm text-gray-500 font-normal">({servers.length} سيرفر)</span></h3>
      <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-2.5">
        {servers.map((server, i) => (
          <button
            key={i}
            onClick={() => { setActiveServer(i); setLoading(true); }}
            className={`server-btn p-3 rounded-lg text-right border ${activeServer === i ? 'bg-red-600 border-red-500 shadow-lg shadow-red-600/40' : 'bg-gray-800 hover:bg-gray-700 border-gray-700'}`}
          >
            <div className="font-bold mb-1 text-sm">{server.name}</div>
            <div className="text-xs opacity-80">{server.quality}</div>
          </button>
        ))}
      </div>
    </div>
  );
}

function MovieModal({ movie, onClose, videoServers, seriesServers }) {
  const [details, setDetails] = useState(null);
  const [loading, setLoading] = useState(true);
  const [showTrailer, setShowTrailer] = useState(false);

  useEffect(() => {
    document.body.style.overflow = "hidden";
    const id = movie.tmdbId || movie.id;
    if (id) {
      setLoading(true);
      TMDB.getMovieDetails(id)
        .then(d => { setDetails(d); setLoading(false); })
        .catch(() => setLoading(false));
    } else setLoading(false);
    return () => { document.body.style.overflow = "auto"; };
  }, [movie]);

  useEffect(() => {
    const handleEsc = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", handleEsc);
    return () => window.removeEventListener("keydown", handleEsc);
  }, [onClose]);

  const cast = details?.credits?.cast?.slice(0, 8) || [];
  const trailer = details?.videos?.results?.find(v => v.type === "Trailer" && v.site === "YouTube");
  const trailerKey = movie.trailerUrl || trailer?.key || null;
  const poster = movie.poster || TMDB.img(details?.poster_path, "w500");
  const title = movie.title_ar || details?.title || movie.title;
  const tmdbId = movie.tmdbId || movie.id;

  return (
    <div className="fixed inset-0 bg-black/95 z-[100] overflow-y-auto fade-in" onClick={onClose}>
      <div className="min-h-screen" onClick={(e) => e.stopPropagation()}>
        <div className="relative">
          <div className="absolute inset-0 bg-cover bg-center opacity-30" style={{ backgroundImage: `url(${movie.backdrop || TMDB.img(details?.backdrop_path, "original") || poster})` }} />
          <div className="absolute inset-0 bg-gradient-to-t from-black via-black/90 to-black/70" />
          
          <button onClick={onClose} className="fixed top-4 left-4 bg-black/70 hover:bg-red-600 w-11 h-11 rounded-full text-2xl z-20 transition flex items-center justify-center">✕</button>
          
          <div className="relative container mx-auto px-4 pt-20 pb-10 max-w-6xl">
            <div className="grid md:grid-cols-[280px_1fr] gap-8 items-start">
              <div className="flex flex-col gap-3">
                <img 
                  src={poster} 
                  alt={title} 
                  className="w-full max-w-[280px] mx-auto rounded-xl shadow-2xl" 
                  onError={(e) => { e.target.src = fallbackPoster(title); }} 
                />
                {trailerKey ? (
                  <button onClick={() => setShowTrailer(!showTrailer)} className="bg-yellow-600 hover:bg-yellow-700 text-white py-3 rounded-xl font-bold transition-all hover:scale-105">
                    🎞️ {showTrailer ? "إخفاء الترايلر" : "شاهد الترايلر"}
                  </button>
                ) : (
                  <div className="bg-gray-800/60 text-gray-500 py-3 rounded-xl text-center text-sm">🎞️ الترايلر غير متوفر</div>
                )}
              </div>
              
              <div>
                <h1 className="text-3xl md:text-5xl font-bold mb-2">{title}</h1>
                <p className="text-gray-400 mb-4">{movie.title || details?.original_title}</p>
                
                <div className="flex items-center gap-3 mb-4 flex-wrap text-sm">
                  <span className="text-yellow-400 font-bold text-lg">⭐ {(movie.rating || details?.vote_average)?.toString().substring(0,3)}</span>
                  <span className="text-gray-300">{movie.year || (details?.release_date || "").substring(0, 4)}</span>
                  {details?.runtime && <span className="text-gray-300">🕒 {details.runtime} دقيقة</span>}
                  {details?.status && <span className="bg-green-600/20 text-green-400 px-2 py-0.5 rounded text-xs">{details.status}</span>}
                </div>
                
                <div className="flex gap-2 mb-5 flex-wrap">
                  {details?.genres?.map(g => (
                    <span key={g.id} className="bg-red-600/20 border border-red-600/40 text-red-300 px-3 py-1 rounded-full text-sm">{g.name}</span>
                  ))}
                </div>
                
                <p className="text-gray-300 leading-relaxed mb-6">{movie.description || details?.overview || "لا يوجد وصف متوفر."}</p>
                
                {loading ? (
                  <div className="flex items-center gap-2 text-gray-500 mb-6">
                    <div className="spinner"></div> جاري التحميل...
                  </div>
                ) : cast.length > 0 ? (
                  <div className="mb-6">
                    <h3 className="text-lg font-bold mb-3">🎭 طاقم التمثيل:</h3>
                    <div className="grid grid-cols-4 md:grid-cols-8 gap-3">
                      {cast.map((actor, i) => (
                        <div key={i} className="cast-card text-center">
                          {actor.profile_path ? (
                            <img src={TMDB.img(actor.profile_path, "w200")} alt={actor.name} className="w-full aspect-square object-cover rounded-lg shadow-lg bg-gray-800" loading="lazy" />
                          ) : (
                            <div className="w-full aspect-square bg-gray-800 rounded-lg flex items-center justify-center text-3xl">👤</div>
                          )}
                          <p className="text-[11px] mt-2 font-bold line-clamp-2 leading-tight">{actor.name}</p>
                          <p className="text-[10px] text-gray-500 line-clamp-1">{actor.character}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                ) : null}
              </div>
            </div>
          </div>
        </div>
        
        {showTrailer && trailerKey && (
          <div className="container mx-auto px-4 pb-6 max-w-6xl fade-in">
            <div className="aspect-video bg-black rounded-xl overflow-hidden shadow-2xl">
              <iframe src={`https://www.youtube.com/embed/${trailerKey}?autoplay=1`} className="w-full h-full" allowFullScreen allow="autoplay" title="Trailer" />
            </div>
          </div>
        )}
        
        <div className="container mx-auto px-4 py-6 max-w-6xl">
          <SmartPlayer
            tmdbId={tmdbId}
            type="movie"
            title={title}
            videoServers={videoServers}
            seriesServers={seriesServers}
          />
        </div>
      </div>
    </div>
  );
}

function SeriesModal({ series, onClose, videoServers, seriesServers }) {
  const [details, setDetails] = useState(null);
  const [loading, setLoading] = useState(true);
  const [seasons, setSeasons] = useState([]);
  const [activeSeason, setActiveSeason] = useState(1);
  const [episodes, setEpisodes] = useState([]);
  const [activeEpisode, setActiveEpisode] = useState(1);
  const [loadingEpisodes, setLoadingEpisodes] = useState(false);
  const [showTrailer, setShowTrailer] = useState(false);

  const loadEpisodes = async (seriesId, seasonNum) => {
    setLoadingEpisodes(true);
    try {
      const d = await TMDB.getSeasonDetails(seriesId, seasonNum);
      setEpisodes(d.episodes || []);
      setActiveEpisode(1);
    } catch (e) { setEpisodes([]); }
    setLoadingEpisodes(false);
  };

  useEffect(() => {
    document.body.style.overflow = "hidden";
    const seriesId = series?.id || series?.tmdbId;
    if (seriesId) {
      setLoading(true);
      setDetails(null);
      TMDB.getSeriesDetails(seriesId).then(d => {
        setDetails(d);
        const validSeasons = (d.seasons || []).filter(s => s.season_number > 0);
        setSeasons(validSeasons);
        const first = validSeasons.find(s => s.season_number === 1) || validSeasons[0];
        if (first) { 
          setActiveSeason(first.season_number); 
          loadEpisodes(seriesId, first.season_number); 
        }
        setLoading(false);
      }).catch(() => setLoading(false));
    } else {
      setLoading(false);
    }
    return () => { document.body.style.overflow = "auto"; };
  }, [series]);

  useEffect(() => {
    const handleEsc = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", handleEsc);
    return () => window.removeEventListener("keydown", handleEsc);
  }, [onClose]);

  const handleSeasonChange = (num) => {
    const seriesId = series?.id || series?.tmdbId;
    setActiveSeason(num);
    loadEpisodes(seriesId, num);
  };

  if (!series) return null;

  const title = details?.name || details?.original_name || series.name || series.original_name || series.title_ar || series.title || "مسلسل بدون عنوان";
  const year = (details?.first_air_date || series.first_air_date || "").substring(0, 4);
  const rating = (details?.vote_average || series.vote_average)?.toFixed(1) || "0";
  const poster = TMDB.img(details?.poster_path || series.poster_path, "w500");
  const backdrop = TMDB.img(details?.backdrop_path || series.backdrop_path, "original");
  const cast = details?.credits?.cast?.slice(0, 8) || [];
  const trailer = details?.videos?.results?.find(v => v.type === "Trailer" && v.site === "YouTube");
  const seriesId = series?.id || series?.tmdbId;

  return (
    <div className="fixed inset-0 bg-black/95 z-[100] overflow-y-auto fade-in" onClick={onClose}>
      <div className="min-h-screen" onClick={(e) => e.stopPropagation()}>
        <div className="relative">
          <div className="absolute inset-0 bg-cover bg-center opacity-30" style={{ backgroundImage: `url(${backdrop || poster})` }} />
          <div className="absolute inset-0 bg-gradient-to-t from-black via-black/90 to-black/70" />
          
          <button onClick={onClose} className="fixed top-4 left-4 bg-black/70 hover:bg-red-600 w-11 h-11 rounded-full text-2xl z-20 transition flex items-center justify-center">✕</button>
          
          <div className="relative container mx-auto px-4 pt-20 pb-10 max-w-6xl">
            <div className="grid md:grid-cols-[280px_1fr] gap-8 items-start">
              <div className="flex flex-col gap-3">
                <img src={poster || fallbackPoster(title, "مسلسل")} alt={title} className="w-full max-w-[280px] mx-auto rounded-xl shadow-2xl" />
                {trailer ? (
                  <button onClick={() => setShowTrailer(!showTrailer)} className="bg-yellow-600 hover:bg-yellow-700 text-white py-3 rounded-xl font-bold transition-all hover:scale-105">
                    🎞️ {showTrailer ? "إخفاء الترايلر" : "شاهد الترايلر"}
                  </button>
                ) : (
                  <div className="bg-gray-800/60 text-gray-500 py-3 rounded-xl text-center text-sm">🎞️ الترايلر غير متوفر</div>
                )}
              </div>
              
              <div>
                <span className="bg-blue-600 px-3 py-1 rounded-full text-xs font-bold mb-3 inline-block">📺 مسلسل</span>
                <h1 className="text-3xl md:text-5xl font-bold mb-3">{title}</h1>
                <div className="flex items-center gap-3 mb-4 flex-wrap text-sm">
                  <span className="text-yellow-400 font-bold text-lg">⭐ {rating}</span>
                  <span className="text-gray-300">{year}</span>
                  {details?.original_language && <span className="text-gray-300">{details.original_language.toUpperCase()}</span>}
                  <span className="text-gray-400">📺 {seasons.length} مواسم</span>
                </div>
                <p className="text-gray-300 leading-relaxed mb-6">{details?.overview || series.overview || "لا يوجد وصف متوفر."}</p>
                
                {loading ? (
                  <div className="flex items-center gap-2 text-gray-500 mb-6"><div className="spinner"></div> جاري التحميل...</div>
                ) : cast.length > 0 ? (
                  <div className="mb-6">
                    <h3 className="text-lg font-bold mb-3">🎭 طاقم التمثيل:</h3>
                    <div className="grid grid-cols-4 md:grid-cols-8 gap-3">
                      {cast.map((actor, i) => (
                        <div key={i} className="cast-card text-center">
                          {actor.profile_path ? (
                            <img src={TMDB.img(actor.profile_path, "w200")} alt={actor.name} className="w-full aspect-square object-cover rounded-lg shadow-lg bg-gray-800" loading="lazy" />
                          ) : (
                            <div className="w-full aspect-square bg-gray-800 rounded-lg flex items-center justify-center text-3xl">👤</div>
                          )}
                          <p className="text-[11px] mt-2 font-bold line-clamp-2 leading-tight">{actor.name}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                ) : null}
              </div>
            </div>
          </div>
        </div>

        {showTrailer && trailer && (
          <div className="container mx-auto px-4 pb-6 max-w-6xl fade-in">
            <div className="aspect-video bg-black rounded-xl overflow-hidden shadow-2xl">
              <iframe src={`https://www.youtube.com/embed/${trailer.key}?autoplay=1`} className="w-full h-full" allowFullScreen allow="autoplay" title="Trailer" />
            </div>
          </div>
        )}

        <div className="container mx-auto px-4 py-6 max-w-6xl">
          <SmartPlayer
            tmdbId={seriesId}
            type="tv"
            season={activeSeason}
            episode={activeEpisode}
            title={`${title} - S${activeSeason}E${activeEpisode}`}
            videoServers={videoServers}
            seriesServers={seriesServers}
          />

          {seasons.length > 0 && (
            <div className="mb-6 mt-8">
              <h3 className="text-xl font-bold mb-3">📺 المواسم:</h3>
              <div className="flex gap-2 flex-wrap">
                {seasons.map(s => (
                  <button key={s.id} onClick={() => handleSeasonChange(s.season_number)} className={`px-4 py-2 rounded-lg transition ${activeSeason === s.season_number ? 'bg-red-600 shadow-lg' : 'bg-gray-800 hover:bg-gray-700'}`}>
                    {s.name || `موسم ${s.season_number}`} <span className="text-xs opacity-70">({s.episode_count})</span>
                  </button>
                ))}
              </div>
            </div>
          )}

          {loadingEpisodes ? (
            <div className="flex items-center gap-2 text-gray-500 py-8"><div className="spinner"></div> جاري تحميل الحلقات...</div>
          ) : episodes.length > 0 ? (
            <div>
              <h3 className="text-xl font-bold mb-3">🎞️ الحلقات <span className="text-sm text-gray-500 font-normal">({episodes.length} حلقة)</span>:</h3>
              <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                {episodes.map(ep => (
                  <button 
                    key={ep.id} 
                    onClick={() => { setActiveEpisode(ep.episode_number); window.scrollTo({ top: 200, behavior: 'smooth' }); }} 
                    className={`p-3 rounded-lg transition text-right border ${activeEpisode === ep.episode_number ? 'bg-red-600 border-red-500 shadow-lg' : 'bg-gray-800 hover:bg-gray-700 border-gray-700'}`}
                  >
                    <div className="font-bold text-sm mb-1">الحلقة {ep.episode_number}</div>
                    <div className="text-xs opacity-80 line-clamp-2">{ep.name || ""}</div>
                    {ep.runtime && <div className="text-[10px] opacity-60 mt-1">🕒 {ep.runtime} د</div>}
                  </button>
                ))}
              </div>
            </div>
          ) : (
            <p className="text-gray-500">لا توجد حلقات متاحة.</p>
          )}
        </div>
      </div>
    </div>
  );
}

function AdminLogin({ onLogin }) {
  const [password, setPassword] = useState("");
  const [error, setError] = useState(false);
  
  return (
    <div className="container mx-auto px-4 pt-32 pb-20 max-w-md">
      <div className="bg-gray-900 border border-gray-800 rounded-xl p-8 fade-in shadow-2xl">
        <div className="text-center mb-6">
          <div className="text-6xl mb-3">🔐</div>
          <h1 className="text-2xl font-bold">لوحة التحكم</h1>
          <p className="text-gray-500 text-sm mt-2">أدخل كلمة السر للوصول</p>
        </div>
        <form onSubmit={(e) => { e.preventDefault(); if (password === CONFIG.ADMIN_PASSWORD) onLogin(); else setError(true); }}>
          <input 
            type="password" 
            value={password} 
            onChange={(e) => { setPassword(e.target.value); setError(false); }} 
            placeholder="كلمة السر" 
            className="w-full bg-black border border-gray-700 rounded-lg px-4 py-3 mb-4 outline-none focus:border-red-500 text-center" 
            autoFocus 
          />
          {error && <p className="text-red-500 text-sm text-center mb-4">❌ كلمة سر خاطئة</p>}
          <button type="submit" className="w-full bg-red-600 hover:bg-red-700 py-3 rounded-lg font-bold transition">دخول</button>
        </form>
      </div>
    </div>
  );
}

function ServerManager({ videoServers, setVideoServers, seriesServers, setSeriesServers }) {
  const [tab, setTab] = useState("video");
  const [editing, setEditing] = useState(null);

  const config = {
    video: { list: videoServers, set: setVideoServers, label: "🎬 سيرفرات مشاهدة الأفلام", placeholder: "https://example.com/embed/movie/{id}", defaults: DEFAULT_VIDEO_SERVERS },
    series: { list: seriesServers, set: setSeriesServers, label: "📺 سيرفرات مشاهدة المسلسلات", placeholder: "https://example.com/embed/tv/{id}/{s}/{e}", defaults: DEFAULT_SERIES_SERVERS },
  };

  const current = config[tab];

  const handleAdd = () => {
    const newServer = { name: "سيرفر جديد", tmpl: current.placeholder, quality: "1080p", enabled: true };
    current.set([...current.list, newServer]);
    setEditing(current.list.length);
  };

  const handleUpdate = (index, field, value) => {
    const updated = [...current.list];
    updated[index] = { ...updated[index], [field]: value };
    current.set(updated);
  };

  const handleDelete = (index) => {
    if (!confirm("حذف هذا السيرفر؟")) return;
    current.set(current.list.filter((_, i) => i !== index));
  };

  const handleToggle = (index) => {
    const updated = [...current.list];
    updated[index] = { ...updated[index], enabled: !updated[index].enabled };
    current.set(updated);
  };

  return (
    <div>
      <div className="flex gap-2 mb-6 flex-wrap">
        {Object.entries(config).map(([key, c]) => (
          <button key={key} onClick={() => { setTab(key); setEditing(null); }} className={`px-5 py-2 rounded-lg font-bold transition ${tab === key ? "bg-red-600" : "bg-gray-800 hover:bg-gray-700"}`}>
            {c.label} ({c.list.length})
          </button>
        ))}
      </div>

      <div className="bg-gray-900 border border-gray-800 rounded-xl p-6">
        <div className="flex items-center justify-between mb-4 flex-wrap gap-3">
          <h3 className="text-xl font-bold">{current.label}</h3>
          <div className="flex gap-2">
            <button onClick={handleAdd} className="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg font-bold">➕ إضافة</button>
            <button onClick={() => { if (confirm("استعادة الافتراضي؟")) current.set(current.defaults); }} className="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg text-sm">
              🔄 افتراضي
            </button>
          </div>
        </div>

        <div className="bg-blue-900/20 border border-blue-700/40 rounded-lg p-3 mb-4 text-sm text-blue-200">
          💡 <strong>المتغيرات:</strong> <code className="bg-black/50 px-2 py-0.5 rounded">{"{id}"}</code> = TMDB ID, <code className="bg-black/50 px-2 py-0.5 rounded">{"{s}"}</code> = موسم, <code className="bg-black/50 px-2 py-0.5 rounded">{"{e}"}</code> = حلقة
        </div>

        <div className="space-y-3">
          {current.list.map((server, i) => (
            <div key={i} className={`bg-black/40 border rounded-lg p-4 ${server.enabled !== false ? 'border-gray-700' : 'border-red-900/50 opacity-60'}`}>
              {editing === i ? (
                <div className="space-y-3">
                  <div className="grid md:grid-cols-3 gap-3">
                    <input type="text" value={server.name} onChange={(e) => handleUpdate(i, "name", e.target.value)} placeholder="اسم السيرفر" className="bg-black border border-gray-700 rounded-lg px-3 py-2 text-sm" />
                    <input type="text" value={server.quality || ""} onChange={(e) => handleUpdate(i, "quality", e.target.value)} placeholder="الجودة" className="bg-black border border-gray-700 rounded-lg px-3 py-2 text-sm" />
                    <label className="flex items-center gap-2 text-sm">
                      <input type="checkbox" checked={server.enabled !== false} onChange={() => handleToggle(i)} className="w-4 h-4" />
                      مفعّل
                    </label>
                  </div>
                  <input type="text" value={server.tmpl} onChange={(e) => handleUpdate(i, "tmpl", e.target.value)} placeholder={current.placeholder} className="w-full bg-black border border-yellow-700/50 rounded-lg px-3 py-2 text-sm font-mono" dir="ltr" />
                  <div className="flex gap-2">
                    <button onClick={() => setEditing(null)} className="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg text-sm font-bold">💾 حفظ</button>
                    <button onClick={() => setEditing(null)} className="bg-gray-700 px-4 py-2 rounded-lg text-sm">إلغاء</button>
                  </div>
                </div>
              ) : (
                <div className="flex items-center gap-3 flex-wrap">
                  <span className={`w-3 h-3 rounded-full ${server.enabled !== false ? 'bg-green-500' : 'bg-red-500'}`}></span>
                  <div className="flex-1 min-w-[200px]">
                    <div className="font-bold">{server.name} <span className="text-xs text-gray-500">({server.quality})</span></div>
                    <div className="text-xs text-gray-400 font-mono truncate" dir="ltr">{server.tmpl}</div>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => handleToggle(i)} className={`px-3 py-1.5 rounded text-xs ${server.enabled !== false ? 'bg-yellow-600 hover:bg-yellow-700' : 'bg-green-600 hover:bg-green-700'}`}>
                      {server.enabled !== false ? "⏸️" : "▶️"}
                    </button>
                    <button onClick={() => setEditing(i)} className="bg-blue-600 hover:bg-blue-700 px-3 py-1.5 rounded text-xs">✏️</button>
                    <button onClick={() => handleDelete(i)} className="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded text-xs">🗑️</button>
                  </div>
                </div>
              )}
            </div>
          ))}
          {current.list.length === 0 && (
            <div className="text-center py-8 text-gray-500">
              <p>لا توجد سيرفرات.</p>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function AdminPanel({ onLogout, videoServers, setVideoServers, seriesServers, setSeriesServers }) {
  const [tab, setTab] = useState("servers");

  return (
    <div className="container mx-auto px-4 pt-32 pb-10 max-w-7xl">
      <div className="flex items-center justify-between mb-6 flex-wrap gap-4">
        <div>
          <h1 className="text-3xl font-bold">⚙️ لوحة التحكم</h1>
          <p className="text-gray-400 text-sm mt-1">إدارة سيرفرات المشاهدة</p>
        </div>
        <button onClick={onLogout} className="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg transition">🚪 خروج</button>
      </div>

      <div className="flex gap-2 mb-6 border-b border-gray-800">
        <button onClick={() => setTab("servers")} className={`px-6 py-3 font-bold transition ${tab === "servers" ? "text-red-500 border-b-2 border-red-500" : "text-gray-400 hover:text-white"}`}>
          🖥️ السيرفرات
        </button>
      </div>

      {tab === "servers" && (
        <ServerManager
          videoServers={videoServers} setVideoServers={setVideoServers}
          seriesServers={seriesServers} setSeriesServers={setSeriesServers}
        />
      )}
    </div>
  );
}

function SeriesPage({ onSeriesClick, initialCategory }) {
  const [activeCat, setActiveCat] = useState(initialCategory || "syrian");
  const [series, setSeries] = useState([]);
  const [loading, setLoading] = useState(true);
  const [page, setPage] = useState(1);
  const [totalPages, setTotalPages] = useState(1);

  useEffect(() => { if (initialCategory) setActiveCat(initialCategory); }, [initialCategory]);

  useEffect(() => {
    setLoading(true);
    setSeries([]);
    setPage(1);
    const cat = SERIES_CATEGORIES.find(c => c.id === activeCat);
    if (!cat) { setLoading(false); return; }
    TMDB.getSeriesByCategory(cat.api, 1).then(data => {
      setSeries(data.results || []);
      setTotalPages(Math.min(data.total_pages || 1, 20));
      setLoading(false);
    }).catch(() => setLoading(false));
  }, [activeCat]);

  const loadMore = () => {
    const nextPage = page + 1;
    if (nextPage > totalPages) return;
    setPage(nextPage);
    setLoading(true);
    const cat = SERIES_CATEGORIES.find(c => c.id === activeCat);
    TMDB.getSeriesByCategory(cat.api, nextPage).then(data => {
      setSeries(prev => [...prev, ...(data.results || [])]);
      setLoading(false);
    }).catch(() => setLoading(false));
  };

  return (
    <div className="container mx-auto px-4 pt-32 pb-10">
      <h1 className="text-4xl font-bold mb-8">📺 المسلسلات</h1>
      <div className="flex gap-2 mb-8 flex-wrap">
        {SERIES_CATEGORIES.map(c => (
          <button key={c.id} onClick={() => setActiveCat(c.id)} className={`px-5 py-2.5 rounded-full transition font-bold ${activeCat === c.id ? 'bg-red-600 shadow-lg' : 'bg-gray-800 hover:bg-gray-700'}`}>{c.name}</button>
        ))}
      </div>
      {loading && series.length === 0 ? (
        <div className="text-center py-20"><div className="spinner mx-auto mb-3" style={{ width: 45, height: 45, borderWidth: 4 }}></div><p className="text-gray-400">جاري تحميل المسلسلات...</p></div>
      ) : series.length > 0 ? (
        <>
          <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
            {series.map(s => (
              <MovieCard key={`${s.id}-${s.name}`} movie={{
                id: s.id, title_ar: s.name || s.original_name, title: s.original_name,
                poster: TMDB.img(s.poster_path, "w500"),
                rating: s.vote_average?.toFixed(1) || "0",
                year: (s.first_air_date || "").substring(0, 4),
                isSeries: true,
                isRamadan: activeCat === "ramadan"
              }} onClick={() => onSeriesClick(s)} />
            ))}
          </div>
          {page < totalPages && (
            <div className="text-center mt-8">
              <button onClick={loadMore} disabled={loading} className="bg-red-600 hover:bg-red-700 disabled:opacity-50 px-8 py-3 rounded-lg font-bold transition">
                {loading ? "جاري التحميل..." : "تحميل المزيد"}
              </button>
            </div>
          )}
        </>
      ) : (
        <div className="text-center py-20 text-gray-500">
          <div className="text-6xl mb-4">📺</div>
          <p>لا توجد مسلسلات في هذا التصنيف</p>
        </div>
      )}
    </div>
  );
}

function MoviesPage({ onMovieClick }) {
  const [selectedGenre, setSelectedGenre] = useState("الكل");
  const [sortBy, setSortBy] = useState("popularity.desc");
  const [movies, setMovies] = useState([]);
  const [loading, setLoading] = useState(true);
  const [page, setPage] = useState(1);
  const [totalPages, setTotalPages] = useState(1);

  useEffect(() => {
    setLoading(true);
    setMovies([]);
    setPage(1);
    const genreId = selectedGenre === "الكل" ? null : GENRE_MAP[selectedGenre];
    TMDB.getMovies({ sortBy, genre: genreId, page: 1 }).then(data => {
      setMovies(data.results || []);
      setTotalPages(Math.min(data.total_pages || 1, 500));
      setLoading(false);
    }).catch(() => setLoading(false));
  }, [selectedGenre, sortBy]);

  const loadMore = () => {
    const nextPage = page + 1;
    if (nextPage > totalPages) return;
    setPage(nextPage);
    setLoading(true);
    const genreId = selectedGenre === "الكل" ? null : GENRE_MAP[selectedGenre];
    TMDB.getMovies({ sortBy, genre: genreId, page: nextPage }).then(data => {
      setMovies(prev => [...prev, ...(data.results || [])]);
      setLoading(false);
    }).catch(() => setLoading(false));
  };

  return (
    <div className="container mx-auto px-4 pt-32 pb-10">
      <h1 className="text-4xl font-bold mb-4">🎬 كل الأفلام</h1>
      <p className="text-gray-400 text-sm mb-6">آلاف الأفلام من قاعدة TMDb</p>

      <div className="flex gap-2 mb-4 flex-wrap">
        <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-sm">
          <option value="popularity.desc">🔥 الأكثر شهرة</option>
          <option value="vote_average.desc">⭐ الأعلى تقييماً</option>
          <option value="release_date.desc">🆕 الأحدث</option>
          <option value="revenue.desc">💰 الأعلى إيرادات</option>
        </select>
      </div>

      <div className="flex gap-2 mb-8 flex-wrap">
        {MOVIE_GENRES.map(g => (
          <button key={g} onClick={() => setSelectedGenre(g)} className={`px-4 py-2 rounded-full transition ${selectedGenre === g ? 'bg-red-600 shadow-lg' : 'bg-gray-800 hover:bg-gray-700'}`}>{g}</button>
        ))}
      </div>

      {loading && movies.length === 0 ? (
        <div className="text-center py-20"><div className="spinner mx-auto mb-3" style={{ width: 45, height: 45, borderWidth: 4 }}></div><p className="text-gray-400">جاري التحميل...</p></div>
      ) : (
        <>
          <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
            {movies.map(m => (
              <MovieCard key={m.id} movie={{
                id: m.id, tmdbId: m.id,
                title_ar: m.title, title: m.original_title,
                poster: TMDB.img(m.poster_path, "w500"),
                backdrop: TMDB.img(m.backdrop_path, "original"),
                rating: m.vote_average?.toFixed(1) || "0",
                year: (m.release_date || "").substring(0, 4),
                description: m.overview
              }} onClick={onMovieClick} />
            ))}
          </div>
          {page < totalPages && (
            <div className="text-center mt-8">
              <button onClick={loadMore} disabled={loading} className="bg-red-600 hover:bg-red-700 disabled:opacity-50 px-8 py-3 rounded-lg font-bold transition">
                {loading ? "جاري التحميل..." : "تحميل المزيد"}
              </button>
            </div>
          )}
        </>
      )}
    </div>
  );
}

function SearchPage({ query, onMovieClick, onSeriesClick, onBack }) {
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (!query) return;
    setLoading(true);
    TMDB.searchMulti(query).then(data => {
      setResults((data.results || []).filter(x => x.media_type !== "person"));
      setLoading(false);
    }).catch(() => setLoading(false));
  }, [query]);

  return (
    <div className="container mx-auto px-4 pt-32 pb-10">
      <button onClick={onBack} className="text-gray-400 hover:text-white mb-4 transition">← رجوع</button>
      <h1 className="text-3xl font-bold mb-8">نتائج البحث: "{query}"</h1>
      {loading ? (
        <div className="text-center py-20"><div className="spinner mx-auto" style={{ width: 45, height: 45, borderWidth: 4 }}></div></div>
      ) : results.length > 0 ? (
        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
          {results.map(r => (
            <MovieCard key={`${r.media_type}-${r.id}`} movie={{
              id: r.id, title_ar: r.title || r.name, title: r.original_title || r.original_name,
              poster: TMDB.img(r.poster_path, "w500"),
              rating: r.vote_average?.toFixed(1) || "0",
              year: (r.release_date || r.first_air_date || "").substring(0, 4),
              isSeries: r.media_type === "tv"
            }} onClick={() => r.media_type === "tv" ? onSeriesClick(r) : onMovieClick({
              id: r.id, tmdbId: r.id, title_ar: r.title, title: r.original_title,
              poster: TMDB.img(r.poster_path, "w500"),
              rating: r.vote_average?.toFixed(1),
              year: (r.release_date || "").substring(0, 4),
              description: r.overview
            })} />
          ))}
        </div>
      ) : (
        <div className="text-center py-20 text-gray-500">
          <div className="text-6xl mb-4">😔</div>
          <p>لا توجد نتائج</p>
        </div>
      )}
    </div>
  );
}

function HomePage({ onMovieClick, onSeriesClick }) {
  const [heroMovie, setHeroMovie] = useState(null);
  const [trending, setTrending] = useState([]);
  const [newReleases, setNewReleases] = useState([]);
  const [topRated, setTopRated] = useState([]);
  const [action, setAction] = useState([]);
  const [syrian, setSyrian] = useState([]);
  const [turkish, setTurkish] = useState([]);
  const [egyptian, setEgyptian] = useState([]);
  const [ramadan, setRamadan] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    const promises = [
      TMDB.getMovies({ sortBy: "popularity.desc", page: 1 }),
      TMDB.getMovies({ sortBy: "release_date.desc", page: 1 }),
      TMDB.getMovies({ sortBy: "vote_average.desc", page: 1 }),
      TMDB.getMovies({ sortBy: "popularity.desc", genre: 28, page: 1 }),
      TMDB.getSeriesByCategory("with_origin_country=SY", 1),
      TMDB.getSeriesByCategory("with_original_language=tr", 1),
      TMDB.getSeriesByCategory("with_origin_country=EG", 1),
      TMDB.getSeriesByCategory("with_original_language=ar&with_genres=18", 1)
    ];

    Promise.allSettled(promises).then(results => {
      const [pop, newR, topR, act, syr, tur, egy, ram] = results.map(r => r.status === "fulfilled" ? r.value : { results: [] });
      
      if (pop.results?.[0]) {
        const m = pop.results[0];
        setHeroMovie({
          id: m.id, tmdbId: m.id,
          title_ar: m.title, title: m.original_title,
          poster: TMDB.img(m.poster_path, "w500"),
          backdrop: TMDB.img(m.backdrop_path, "original"),
          rating: m.vote_average?.toFixed(1) || "0",
          year: (m.release_date || "").substring(0, 4),
          description: m.overview
        });
      }
      
      setTrending((pop.results || []).slice(0, 15));
      setNewReleases((newR.results || []).slice(0, 15));
      setTopRated((topR.results || []).slice(0, 15));
      setAction((act.results || []).slice(0, 15));
      setSyrian((syr.results || []).slice(0, 15));
      setTurkish((tur.results || []).slice(0, 15));
      setEgyptian((egy.results || []).slice(0, 15));
      setRamadan((ram.results || []).slice(0, 15));
      setLoading(false);
    });
  }, []);

  const movieCard = (m) => ({
    id: m.id, tmdbId: m.id,
    title_ar: m.title, title: m.original_title,
    poster: TMDB.img(m.poster_path, "w500"),
    backdrop: TMDB.img(m.backdrop_path, "original"),
    rating: m.vote_average?.toFixed(1) || "0",
    year: (m.release_date || "").substring(0, 4),
    description: m.overview
  });

  const seriesCard = (s, isRamadan = false) => ({
    id: s.id,
    title_ar: s.name || s.original_name || s.title || "مسلسل",
    title: s.original_name || s.name || "",
    name: s.name || s.original_name || "",
    poster: TMDB.img(s.poster_path, "w500"),
    backdrop: TMDB.img(s.backdrop_path, "original"),
    rating: s.vote_average?.toFixed(1) || "0",
    year: (s.first_air_date || "").substring(0, 4),
    overview: s.overview || "",
    vote_average: s.vote_average,
    first_air_date: s.first_air_date,
    original_language: s.original_language,
    isSeries: true,
    isRamadan
  });

  if (loading) {
    return (
      <div className="h-screen flex items-center justify-center">
        <div className="text-center">
          <div className="spinner mx-auto mb-4" style={{ width: 60, height: 60, borderWidth: 5 }}></div>
          <p className="text-gray-400">جاري تحميل المحتوى...</p>
        </div>
      </div>
    );
  }

  return (
    <div>
      {heroMovie && <Hero movie={heroMovie} onPlay={onMovieClick} />}
      <div className="container mx-auto -mt-20 relative z-10">
        <MovieRow title="🔥 الأكثر رواجاً" movies={trending.map(movieCard)} onMovieClick={onMovieClick} />
        <MovieRow title="🌙 مسلسلات رمضان" movies={ramadan.map(s => seriesCard(s, true))} onMovieClick={onSeriesClick} />
        <MovieRow title="🆕 إصدارات جديدة" movies={newReleases.map(movieCard)} onMovieClick={onMovieClick} />
        <MovieRow title="⭐ أعلى تقييماً" movies={topRated.map(movieCard)} onMovieClick={onMovieClick} />
        <MovieRow title="💥 أفلام أكشن" movies={action.map(movieCard)} onMovieClick={onMovieClick} />
        <MovieRow title="🇸🇾 مسلسلات سورية" movies={syrian.map(s => seriesCard(s))} onMovieClick={onSeriesClick} />
        <MovieRow title="🇹🇷 مسلسلات تركية" movies={turkish.map(s => seriesCard(s))} onMovieClick={onSeriesClick} />
        <MovieRow title="🇪🇬 مسلسلات مصرية" movies={egyptian.map(s => seriesCard(s))} onMovieClick={onSeriesClick} />
      </div>
    </div>
  );
}

function Footer() {
  return (
    <footer className="bg-black border-t border-gray-800 mt-20 py-10">
      <div className="container mx-auto px-4 text-center text-gray-500">
        <div className="flex items-center justify-center gap-2 mb-3">
          <span className="text-red-600 text-3xl">🎬</span>
          <span className="gradient-text text-xl font-bold">Syrian Movie Best</span>
        </div>
        <p className="text-xs">© 2025 Syrian Movie Best. جميع الحقوق محفوظة.</p>
        <p className="text-[10px] text-gray-600 mt-2">هذا الموقع لا يستضيف أي محتوى. جميع الأفلام مقدمة من TMDb وسيرفرات خارجية.</p>
      </div>
    </footer>
  );
}

function App() {
  const [videoServers, setVideoServers] = useState(() => load(STORAGE.VIDEO_SERVERS, DEFAULT_VIDEO_SERVERS));
  const [seriesServers, setSeriesServers] = useState(() => load(STORAGE.SERIES_SERVERS, DEFAULT_SERIES_SERVERS));

  const [page, setPage] = useState("home");
  const [selectedMovie, setSelectedMovie] = useState(() => load(STORAGE.SELECTED_MOVIE, null));
  const [selectedSeries, setSelectedSeries] = useState(() => load(STORAGE.SELECTED_SERIES, null));
  const [searchQuery, setSearchQuery] = useState("");
  const [seriesCategory, setSeriesCategory] = useState(null);
  const [isAdmin, setIsAdmin] = useState(false);

  useEffect(() => { save(STORAGE.VIDEO_SERVERS, videoServers); }, [videoServers]);
  useEffect(() => { save(STORAGE.SERIES_SERVERS, seriesServers); }, [seriesServers]);

  useEffect(() => {
    if (selectedMovie) save(STORAGE.SELECTED_MOVIE, selectedMovie);
    else localStorage.removeItem(STORAGE.SELECTED_MOVIE);
  }, [selectedMovie]);

  useEffect(() => {
    if (selectedSeries) save(STORAGE.SELECTED_SERIES, selectedSeries);
    else localStorage.removeItem(STORAGE.SELECTED_SERIES);
  }, [selectedSeries]);

  const navigateFromHash = useCallback(() => {
    const hash = window.location.hash.replace("#", "") || "home";
    if (hash.startsWith("series-")) { 
      setSeriesCategory(hash.replace("series-", "")); 
      setPage("series"); 
    }
    else if (["home", "movies", "series", "admin"].includes(hash)) { 
      setPage(hash); 
      if (hash === "series") setSeriesCategory(null); 
    }
    else setPage("home");
  }, []);

  useEffect(() => {
    navigateFromHash();
    window.addEventListener("hashchange", navigateFromHash);
    return () => window.removeEventListener("hashchange", navigateFromHash);
  }, [navigateFromHash]);

  const handleNavigate = (p) => { window.location.hash = p; window.scrollTo(0, 0); };
  const handleSearch = (q) => { setSearchQuery(q); setPage("search"); window.scrollTo(0, 0); };

  return (
    <div className="min-h-screen">
      <Navbar onSearch={handleSearch} onNavigate={handleNavigate} currentPage={page} />
      {page === "home" && <HomePage onMovieClick={setSelectedMovie} onSeriesClick={setSelectedSeries} />}
      {page === "movies" && <MoviesPage onMovieClick={setSelectedMovie} />}
      {page === "series" && <SeriesPage onSeriesClick={setSelectedSeries} initialCategory={seriesCategory} />}
      {page === "search" && <SearchPage query={searchQuery} onMovieClick={setSelectedMovie} onSeriesClick={setSelectedSeries} onBack={() => handleNavigate("home")} />}
      {page === "admin" && (!isAdmin ? (
        <AdminLogin onLogin={() => setIsAdmin(true)} />
      ) : (
        <AdminPanel
          onLogout={() => { setIsAdmin(false); handleNavigate("home"); }}
          videoServers={videoServers} setVideoServers={setVideoServers}
          seriesServers={seriesServers} setSeriesServers={setSeriesServers}
        />
      ))}
      {selectedMovie && (
        <MovieModal
          movie={selectedMovie}
          onClose={() => setSelectedMovie(null)}
          videoServers={videoServers}
          seriesServers={seriesServers}
        />
      )}
      {selectedSeries && (
        <SeriesModal
          series={selectedSeries}
          onClose={() => setSelectedSeries(null)}
          videoServers={videoServers}
          seriesServers={seriesServers}
        />
      )}
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
